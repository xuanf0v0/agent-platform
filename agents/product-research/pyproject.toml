[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amazon_product_research*"]
exclude = ["tests*"]

[project]
name = "amazon-product-research"
version = "0.1.0"
description = "Evidence-driven Amazon product research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1,<2",
  "openai>=1,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2",
  "pydantic-settings>=2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["amazon_product_research", "tests"]
