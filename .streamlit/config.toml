[theme]
base = "dark"
primaryColor = "#e8702a"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#ffffff"
borderColor = "#2a2a2a"
linkColor = "#e8702a"
codeBackgroundColor = "#1a1a1a"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

[theme.sidebar]
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#f5f5f5"
primaryColor = "#e8702a"
borderColor = "#2a2a2a"
