<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Manager — Amazon Listing AI 管理控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   GLOBAL RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f; --bg-alt:#0a0f1a; --surface:rgba(16,20,35,0.85);
  --surface-hover:rgba(22,28,48,0.9); --border:rgba(99,140,255,0.12);
  --border-hover:rgba(99,140,255,0.28);
  --text:#e8ecf4; --text-soft:rgba(232,236,244,0.7); --text-muted:rgba(232,236,244,0.45);
  --primary:#638cff; --primary-glow:rgba(99,140,255,0.3);
  --accent:#7c5cfc; --accent-glow:rgba(124,92,252,0.3);
  --cyan:#00d4ff; --cyan-glow:rgba(0,212,255,0.25);
  --green:#22c55e; --green-glow:rgba(34,197,94,0.25);
  --orange:#f97316; --orange-glow:rgba(249,115,22,0.3);
  --red:#ef4444; --red-glow:rgba(239,68,68,0.25);
  --radius:14px; --radius-lg:20px; --radius-pill:9999px;
  --font-sans:'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
  font-family:var(--font-sans); color:var(--text);
}
.light{
  --bg:#f0f4ff; --bg-alt:#e4ecff; --surface:rgba(255,255,255,0.85);
  --surface-hover:rgba(255,255,255,0.95); --border:rgba(99,140,255,0.18);
  --border-hover:rgba(99,140,255,0.35);
  --text:#111827; --text-soft:rgba(17,24,39,0.7); --text-muted:rgba(17,24,39,0.45);
}
html{scroll-behavior:smooth}
body{background:var(--bg);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ═══════════════════════════════════════════════════════════
   PARTICLE CANVAS
   ═══════════════════════════════════════════════════════════ */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ═══════════════════════════════════════════════════════════
   GRID BACKGROUND
   ═══════════════════════════════════════════════════════════ */
.grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:linear-gradient(rgba(99,140,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(99,140,255,0.03) 1px,transparent 1px);
  background-size:50px 50px;pointer-events:none;z-index:0}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.5rem}

/* ═══════════════════════════════════════════════════════════
   NAVBAR
   ═══════════════════════════════════════════════════════════ */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.875rem 1.5rem;margin-bottom:1.5rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transition:var(--transition);position:sticky;top:1rem;z-index:100;
}
.navbar:hover{border-color:var(--border-hover);box-shadow:0 0 30px var(--primary-glow)}
.nav-logo{display:flex;align-items:center;gap:0.625rem;font-weight:700;font-size:1.1rem}
.nav-logo .icon{font-size:1.5rem}
.nav-actions{display:flex;align-items:center;gap:0.5rem}

/* ═══════════════════════════════════════════════════════════
   GLASS CARD
   ═══════════════════════════════════════════════════════════ */
.glass{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transition:var(--transition);position:relative;overflow:hidden
}
.glass::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);
  transition:0.6s
}
.glass:hover::before{left:100%}
.glass:hover{border-color:var(--border-hover);transform:translateY(-2px);
  box-shadow:0 8px 40px rgba(0,0,0,0.3),0 0 30px var(--primary-glow)}

/* ═══════════════════════════════════════════════════════════
   NEON GLOW EFFECTS
   ═══════════════════════════════════════════════════════════ */
.neon-primary{box-shadow:0 0 20px var(--primary-glow),0 0 60px var(--primary-glow)}
.neon-accent{box-shadow:0 0 20px var(--accent-glow),0 0 60px var(--accent-glow)}
.neon-cyan{box-shadow:0 0 20px var(--cyan-glow),0 0 60px var(--cyan-glow)}
.neon-green{box-shadow:0 0 20px var(--green-glow),0 0 60px var(--green-glow)}
.neon-orange{box-shadow:0 0 20px var(--orange-glow),0 0 60px var(--orange-glow)}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1.25rem;
  font-size:0.875rem;font-weight:600;font-family:var(--font-sans);
  border-radius:var(--radius-pill);cursor:pointer;transition:var(--transition);
  border:1px solid transparent;text-decoration:none;white-space:nowrap
}
.btn:active{transform:scale(0.97)}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;border-color:transparent
}
.btn-primary:hover{box-shadow:0 0 25px var(--primary-glow)}
.btn-cyan{
  background:linear-gradient(135deg,#00b4d8,#0077b6);color:#fff
}
.btn-cyan:hover{box-shadow:0 0 25px rgba(0,180,216,0.4)}
.btn-outline{
  background:transparent;color:var(--text);
  border-color:var(--border)
}
.btn-outline:hover{background:rgba(99,140,255,0.08);border-color:var(--primary)}
.btn-danger{
  background:rgba(239,68,68,0.12);color:var(--red);
  border-color:rgba(239,68,68,0.25)
}
.btn-danger:hover{background:rgba(239,68,68,0.2);box-shadow:0 0 25px var(--red-glow)}
.btn-sm{padding:0.375rem 0.875rem;font-size:0.8rem}
.btn-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  background:transparent;color:var(--text-soft);border:1px solid var(--border);
  transition:var(--transition);font-size:1.1rem
}
.btn-icon:hover{background:rgba(99,140,255,0.1);border-color:var(--primary);color:var(--primary)}

/* ═══════════════════════════════════════════════════════════
   STATUS BADGE
   ═══════════════════════════════════════════════════════════ */
.badge{
  display:inline-flex;align-items:center;gap:0.375rem;
  padding:0.25rem 0.75rem;border-radius:var(--radius-pill);
  font-size:0.75rem;font-weight:600
}
.badge .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.badge-running{background:rgba(34,197,94,0.12);color:var(--green)}
.badge-running .dot{background:var(--green);box-shadow:0 0 6px var(--green-glow);animation:pulse-dot 1.5s infinite}
.badge-stopped{background:rgba(255,255,255,0.05);color:var(--text-muted)}
.badge-stopped .dot{background:var(--text-muted)}
.badge-starting{background:rgba(249,115,22,0.12);color:var(--orange)}
.badge-starting .dot{background:var(--orange);box-shadow:0 0 6px var(--orange-glow);animation:pulse-dot 0.8s infinite}
.badge-error{background:rgba(239,68,68,0.12);color:var(--red)}
.badge-error .dot{background:var(--red);box-shadow:0 0 6px var(--red-glow)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}

/* ═══════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════ */
.tabs{display:flex;gap:0.25rem;margin-bottom:1rem}
.tab{
  padding:0.5rem 1rem;font-size:0.8125rem;font-weight:500;
  color:var(--text-soft);cursor:pointer;border-radius:8px;
  background:transparent;border:none;transition:var(--transition)
}
.tab:hover{color:var(--text);background:rgba(99,140,255,0.06)}
.tab.active{color:var(--primary);background:rgba(99,140,255,0.1)}

/* ═══════════════════════════════════════════════════════════
   FORM ELEMENTS
   ═══════════════════════════════════════════════════════════ */
input[type="text"],input[type="password"],input[type="number"],select{
  background:rgba(0,0,0,0.25);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:0.5rem 0.75rem;font-size:0.8125rem;font-family:var(--font-sans);
  width:100%;transition:var(--transition)
}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow)}
.toggle{position:relative;display:inline-block;width:42px;height:23px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background:rgba(255,255,255,0.12);border-radius:23px;transition:var(--transition)}
.toggle-slider::before{content:"";position:absolute;height:17px;width:17px;
  left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--transition)}
.toggle input:checked+.toggle-slider{background:linear-gradient(135deg,var(--primary),var(--accent))}
.toggle input:checked+.toggle-slider::before{transform:translateX(19px)}

/* ═══════════════════════════════════════════════════════════
   TERMINAL / LOG VIEWER
   ═══════════════════════════════════════════════════════════ */
.terminal{
  background:rgba(2,4,12,0.95);border:1px solid rgba(99,140,255,0.08);
  border-radius:10px;padding:0.75rem 1rem;font-family:var(--font-mono);
  font-size:0.7rem;line-height:1.65;color:rgba(200,215,240,0.85);
  overflow-y:auto;max-height:420px;white-space:pre-wrap;word-break:break-all
}
.terminal .line{padding:1px 0}
.terminal .line:hover{background:rgba(99,140,255,0.06)}

/* ═══════════════════════════════════════════════════════════
   KEYFRAMES
   ═══════════════════════════════════════════════════════════ */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow-pulse{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scan-line{0%{top:-2px}100%{top:100%}}
.animate-slideUp{animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both}

/* ═══════════════════════════════════════════════════════════
   CURSOR GLOW
   ═══════════════════════════════════════════════════════════ */
.cursor-glow{position:fixed;pointer-events:none;z-index:9999;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,140,255,0.08),transparent 70%);
  transform:translate(-50%,-50%);transition:opacity 0.3s}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media(max-width:768px){
  #app{padding:1rem}
  .navbar{padding:0.625rem 1rem;border-radius:var(--radius)}
  .navbar .nav-title-sub{display:none}
  .agent-header{flex-direction:column;align-items:flex-start}
  .agent-actions{width:100%;justify-content:stretch}
  .agent-actions .btn{flex:1;justify-content:center}
  .info-grid{grid-template-columns:1fr}
  .config-row{flex-direction:column;gap:0.25rem}
  .cursor-glow{display:none}
}
@media(max-width:480px){
  .btn{font-size:0.75rem;padding:0.375rem 0.875rem}
  .glass{padding:1rem;border-radius:var(--radius)}
  .nav-logo{font-size:0.95rem}
}

/* ═══════════════════════════════════════════════════════════
   PAGE TRANSITIONS
   ═══════════════════════════════════════════════════════════ */
.page{display:none}
.page.active{display:block;animation:fadeIn 0.4s ease}

/* Chart / Meter */
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden}
.meter-bar{height:100%;border-radius:2px;transition:width 1s ease}
</style>
</head>
<body class="dark">

<!-- ═══════════════════════════════════════════════════════════
     BACKGROUND LAYERS

<!-- ═══════════════════════════════════════════════════════════

<div id="app">

      </h1>

<!-- ═══════════════════════════════════════════════════════════
     SCRIPTS
     ═══════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════════════════════ */
const API = 'http://localhost:8000';
const AGENTS = {
  'listing-creation':{name:'Listing 创作 Agent',icon:'✨',desc:'从 0 到 1 创建 Amazon Listing（Title + Bullets + Search Terms）',desc_en:'Create Amazon listings from scratch',port:8501},
  'listing-optimization':{name:'Listing 优化 Agent',icon:'🔧',desc:'优化现有 Amazon Listing，自动研究 + 重写 + 后检',desc_en:'Optimize existing listings with research, rewrite, and postflight',port:8502}
};

/* ═══════════════════════════════════════════════════════════
   PARTICLE SYSTEM
   ═══════════════════════════════════════════════════════════ */
(function initParticles(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let W,H,particles=[],mouse={x:0,y:0};
  const COLORS=['#638cff','#7c5cfc','#00d4ff','#22c55e'];

  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);

  class Particle{
    constructor(){this.reset(1)}
    reset(init){
      this.x=Math.random()*W;this.y=init?Math.random()*H:H+10;
      this.size=Math.random()*2+0.5;
      this.speed=Math.random()*0.4+0.15;
      this.opacity=Math.random()*0.5+0.15;
      this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
      this.wobble=Math.random()*Math.PI*2;
      this.wobbleSpeed=Math.random()*0.005+0.002;
    }
    update(){
      this.y-=this.speed;this.wobble+=this.wobbleSpeed;
      const dx=(mouse.x-W/2)*0.0002;
      this.x+=Math.sin(this.wobble)*0.3+dx;
      if(this.y<-10)this.reset(0);
    }
    draw(){
      ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
      ctx.fillStyle=this.color.replace(')','').replace('rgb','rgba')+','+this.opacity+')';
      ctx.fill()
    }
  }

  for(let i=0;i<80;i++)particles.push(new Particle());
  document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

  function animate(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{p.update();p.draw()});
    // Draw connections
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle='rgba(99,140,255,'+(0.06*(1-d/120))+')';
          ctx.lineWidth=0.5;ctx.stroke()
        }
      }
    }
    requestAnimationFrame(animate)
  }
  animate()
})();

/* ═══════════════════════════════════════════════════════════
   CURSOR GLOW
   ═══════════════════════════════════════════════════════════ */
(function initCursorGlow(){
  const el=document.getElementById('cursorGlow');
  let timer;
  document.addEventListener('mousemove',e=>{
    el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';
    el.style.opacity='1';clearTimeout(timer);timer=setTimeout(()=>el.style.opacity='0',800)
  });
})();

/* ═══════════════════════════════════════════════════════════
   THEME TOGGLE
   ═══════════════════════════════════════════════════════════ */
function toggleTheme(){
  const html=document.documentElement,isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  html.classList.toggle('light',isDark);
  const icon=document.querySelector('#btnTheme i');
  icon.className=isDark?'ph ph-sun':'ph ph-moon';
  localStorage.setItem('theme',isDark?'light':'dark')
}
(function(){
  const saved=localStorage.getItem('theme');
  if(saved==='light'){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('light');document.querySelector('#btnTheme i').className='ph ph-sun'}
})();

/* ═══════════════════════════════════════════════════════════
   API CLIENT
   ═══════════════════════════════════════════════════════════ */
async function api(path,opts={}){
  try{
    const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...opts.headers},...opts});
    if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.error||'HTTP '+res.status)}
    return res.json()
  }catch(e){console.error('API Error:',e);throw e}
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION & GLOBALS
   ═══════════════════════════════════════════════════════════ */
let currentAgentId=null,pollTimer=null;

function goHome(){
  currentAgentId=null;
  document.getElementById('pageDetail').classList.remove('active');
  document.getElementById('pageDashboard').classList.add('active');
  document.getElementById('btnBack').style.display='none';
  fetchAgents();
}
function goDetail(agentId){
  currentAgentId=agentId;
  document.getElementById('pageDashboard').classList.remove('active');
  document.getElementById('pageDetail').classList.add('active');
  document.getElementById('btnBack').style.display='inline-flex';
  renderDetail();
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
async function fetchAgents(){
  try{
    const data=await api('/api/agents');
    document.getElementById('navStatus').innerHTML='● 已连接';
    document.getElementById('navStatus').style.color='var(--green)';
    renderCards(data);
  }catch(e){
    document.getElementById('navStatus').innerHTML='● 后端未连接';
    document.getElementById('navStatus').style.color='var(--red)';
  }
}

function renderCards(agents){
  const running=agents.filter(a=>a.status==='running').length;
  const badge=document.getElementById('globalStatus');
  if(running>0){badge.className='badge badge-running';badge.innerHTML='<span class="dot"></span>'+running+'/'+agents.length+' 运行中'}
  else{badge.className='badge badge-stopped';badge.innerHTML='<span class="dot"></span>就绪'}

  const container=document.getElementById('agentCards');
  container.innerHTML=agents.map((a,i)=>{
    const running=a.status==='running',starting=a.status==='starting';
    const badgeCls=running?'badge-running':starting?'badge-starting':a.status==='error'?'badge-error':'badge-stopped';
    const badgeLabel=running?'运行中':starting?'启动中':a.status==='error'?'错误':'已停止';
    const uptime=a.started_at?formatUptime(Math.floor(Date.now()/1000-a.started_at)):'';
    return `
    <div class="glass animate-slideUp" style="padding:1.5rem;margin-bottom:1rem;--delay:${i*0.1}s">
      <div class="agent-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem">
        <div style="display:flex;align-items:center;gap:0.75rem;flex:1">
          <span style="font-size:2.25rem;line-height:1">${AGENTS[a.id].icon}</span>
          <div>
            <h3 style="font-size:1.1rem;font-weight:700;margin:0">${AGENTS[a.id].name}</h3>
            <p style="color:var(--text-soft);font-size:0.8rem;margin:3px 0 0;line-height:1.4">${AGENTS[a.id].desc}</p>
          </div>
        </div>
        <span class="badge ${badgeCls}"><span class="dot"></span>${badgeLabel}</span>
      </div>
      <div class="info-grid" style="display:flex;gap:1.5rem;margin-top:0.75rem;color:var(--text-soft);font-size:0.78rem;flex-wrap:wrap">
        ${running?`<span>🖥 端口 <code style="color:var(--primary);background:rgba(99,140,255,0.1);padding:1px 6px;border-radius:4px">${AGENTS[a.id].port}</code></span>`:''}
        ${uptime?`<span>⏱ ${uptime}</span>`:''}
        ${a.pid>0?`<span>🔢 PID ${a.pid}</span>`:''}
        ${a.status==='error'&&a.error_message?`<span style="color:var(--red)">⚠ ${a.error_message}</span>`:''}
      </div>
      <div class="agent-actions" style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap">
        ${running
          ?`<button class="btn btn-danger btn-sm" onclick="stopAgent('${a.id}')"><i class="ph ph-stop-circle"></i>停止</button>
            <button class="btn btn-cyan btn-sm" onclick="window.open('${a.url}','_blank')"><i class="ph ph-arrow-square-out"></i>打开 Agent</button>`
          :`<button class="btn btn-primary btn-sm" onclick="startAgent('${a.id}')" ${starting?'disabled':''}><i class="ph ph-play-circle"></i>${starting?'启动中...':'启动'}</button>`}
        <button class="btn btn-outline btn-sm" onclick="goDetail('${a.id}')"><i class="ph ph-gear"></i>配置与日志</button>
      </div>
    </div>`
  }).join('');

  // Stagger animations
  requestAnimationFrame(()=>{
    document.querySelectorAll('.animate-slideUp').forEach((el,i)=>{
      el.style.animationDelay=(i*0.1)+'s'
    })
  });
}

function formatUptime(s){
  if(s<60)return s+'秒';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?h+'时'+m+'分':m+'分钟'
}

async function startAgent(id){
  const btn=event.target.closest('button');btn.disabled=true;btn.innerHTML='<i class="ph ph-spinner"></i>启动中...';
  try{await api('/api/agents/'+id+'/start',{method:'POST'});fetchAgents()}catch(e){alert('启动失败: '+e.message);btn.disabled=false;btn.innerHTML='<i class="ph ph-play-circle"></i>启动'}
}
async function stopAgent(id){
  if(!confirm('确定要停止该 Agent 吗？'))return;
  const btn=event.target.closest('button');btn.disabled=true;btn.innerHTML='<i class="ph ph-spinner"></i>停止中...';
  try{await api('/api/agents/'+id+'/stop',{method:'POST'});fetchAgents()}catch(e){alert('停止失败: '+e.message);btn.disabled=false;btn.innerHTML='<i class="ph ph-stop-circle"></i>停止'}
}

/* ═══════════════════════════════════════════════════════════
   AGENT DETAIL PAGE
   ═══════════════════════════════════════════════════════════ */
let detailTab='config',detailLogs=[],detailWs=null;

async function renderDetail(){
  const a=AGENTS[currentAgentId],container=document.getElementById('detailHeader');
  let agentInfo;
  try{agentInfo=await api('/api/agents/'+currentAgentId)}catch(e){agentInfo=null}

  const running=agentInfo&&agentInfo.status==='running';
  const badgeCls=running?'badge-running':'badge-stopped';
  const badgeLabel=running?'运行中':'已停止';

  container.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <span style="font-size:2.5rem">${a.icon}</span>
        <div>
          <h2 style="font-size:1.25rem;font-weight:700;margin:0">${a.name}</h2>
          <p style="color:var(--text-soft);font-size:0.8rem;margin:2px 0 0">${a.desc_en}</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <span class="badge ${badgeCls}"><span class="dot"></span>${badgeLabel}</span>
        ${running
          ?`<button class="btn btn-danger btn-sm" onclick="stopAgentDetail()"><i class="ph ph-stop-circle"></i>停止</button>
            <button class="btn btn-cyan btn-sm" onclick="window.open('${agentInfo.url}','_blank')"><i class="ph ph-arrow-square-out"></i>打开</button>`
          :`<button class="btn btn-primary btn-sm" onclick="startAgentDetail()"><i class="ph ph-play-circle"></i>启动</button>`}
      </div>
    </div>
    ${agentInfo&&running?`<div style="display:flex;gap:1.5rem;margin-top:0.75rem;color:var(--text-soft);font-size:0.78rem">
      <span>🖥 ${a.port}</span>${agentInfo.pid?`<span>PID ${agentInfo.pid}</span>`:''}
    </div>`:''}
  `;

  detailTab='config';
  await switchDetailTab();
}

async function switchDetailTab(tab){
  if(tab)detailTab=tab;
  // Update tab UI
  const content=document.getElementById('detailContent');
  const tabs=content.querySelector('.tabs');
  if(tabs){
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===detailTab));
  }

  if(detailTab==='config')await renderConfig(currentAgentId);
  else renderLogs(currentAgentId);
}

async function startAgentDetail(){
  await api('/api/agents/'+currentAgentId+'/start',{method:'POST'});
  renderDetail();
}
async function stopAgentDetail(){
  if(!confirm('确定要停止该 Agent 吗？'))return;
  await api('/api/agents/'+currentAgentId+'/stop',{method:'POST'});
  renderDetail();
}

/* ── Config Tab ────────────────────────────────────────── */
async function renderConfig(agentId){
  const a=AGENTS[agentId],div=document.getElementById('detailContent');
  div.innerHTML=`<div class="tabs">
    <button class="tab active" data-tab="config" onclick="switchDetailTab('config')"><i class="ph ph-sliders-horizontal"></i> 配置</button>
    <button class="tab" data-tab="logs" onclick="switchDetailTab('logs')"><i class="ph ph-terminal-window"></i> 实时日志</button>
  </div><div id="configInner" style="color:var(--text-soft)">加载中...</div>`;

  let fields;
  try{fields=await api('/api/agents/'+agentId+'/config')}catch(e){div.querySelector('#configInner').innerHTML=`<span style="color:var(--red)">加载失败: ${e.message}</span>`;return}

  let edited={},saving=false;
  function renderFields(){
    document.getElementById('configInner').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
      <h4 style="font-size:0.95rem;font-weight:600;color:var(--text)">环境配置 (.env)</h4>
      <div style="display:flex;align-items:center;gap:0.5rem">
        <span id="saveMsg"></span>
        <button class="btn btn-primary btn-sm" id="btnSave" onclick="saveConfig('${agentId}')" ${Object.keys(edited).length===0?'disabled':''}>保存</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.5rem">
    ${fields.map(f=>{
      const v=edited[f.key]!==undefined?edited[f.key]:f.value;
      const dirty=edited[f.key]!==undefined;
      return`
      <div class="config-row" style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;background:${dirty?'rgba(99,140,255,0.06)':'transparent'};border-radius:8px;border:1px solid ${dirty?'rgba(99,140,255,0.2)':'transparent'};transition:var(--transition)">
        <label style="flex:0 0 130px;font-size:0.8rem;color:var(--text-soft)">${f.label}</label>
        <div style="flex:1">
          ${f.type==='boolean'?`
            <label class="toggle"><input type="checkbox" ${v==='true'||v==='True'?'checked':''} onchange="editField('${f.key}',this.checked?'true':'false','${agentId}')"><span class="toggle-slider"></span></label>
          `:f.type==='select'&&f.options?`
            <select onchange="editField('${f.key}',this.value,'${agentId}')">${f.options.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select>
          `:f.type==='secret'?`
            <input type="password" value="${v}" onchange="editField('${f.key}',this.value,'${agentId}')" placeholder="${f.is_masked?'已设置':'未设置'}" style="font-family:var(--font-mono);font-size:0.7rem">
          `:f.type==='number'?`
            <input type="number" value="${v}" onchange="editField('${f.key}',this.value,'${agentId}')">
          `:`
            <input type="text" value="${v}" onchange="editField('${f.key}',this.value,'${agentId}')" style="font-family:${f.key.includes('MODEL')?'var(--font-mono)':'inherit'};font-size:${f.key.includes('MODEL')?'0.72rem':'0.8125rem'}">
          `}
        </div>
        ${dirty?`<span style="font-size:0.65rem;color:var(--primary)">已修改</span>`:''}
      </div>`
    }).join('')}
    </div>`;

    window._configEdited=edited;
    window._configAgentId=agentId;
  }
  window.editField=function(key,value,agentId){
    edited[key]=value;
    renderFields();
    document.getElementById('btnSave').disabled=false;
    document.getElementById('saveMsg').innerHTML='';
  };
  window.saveConfig=async function(agentId){
    const btn=document.getElementById('btnSave');
    const msg=document.getElementById('saveMsg');
    btn.disabled=true;btn.innerHTML='保存中...';msg.innerHTML='';
    try{
      const updated=await api('/api/agents/'+agentId+'/config',{method:'PUT',body:JSON.stringify(edited)});
      fields=updated;edited={};renderFields();
      msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';
      setTimeout(()=>msg.innerHTML='',3000);
    }catch(e){
      msg.innerHTML='<span style="color:var(--red)">保存失败: '+e.message+'</span>';
      btn.innerHTML='保存';btn.disabled=false;
    }
  };

  renderFields();
}

/* ── Logs Tab ──────────────────────────────────────────── */
function renderLogs(agentId){
  const div=document.getElementById('detailContent');
  div.innerHTML=`
  <div class="tabs">
    <button class="tab" data-tab="config" onclick="switchDetailTab('config')"><i class="ph ph-sliders-horizontal"></i> 配置</button>
    <button class="tab active" data-tab="logs" onclick="switchDetailTab('logs')"><i class="ph ph-terminal-window"></i> 实时日志</button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
    <h4 style="font-size:0.95rem;font-weight:600;color:var(--text);margin:0">
      实时日志 <span id="wsStatus" style="font-size:0.75rem;font-weight:400;margin-left:0.5rem"></span>
    </h4>
    <div style="display:flex;gap:0.75rem;align-items:center">
      <label style="font-size:0.75rem;color:var(--text-soft);display:flex;align-items:center;gap:0.25rem;cursor:pointer">
        <input type="checkbox" id="autoScroll" checked onchange="window._autoScroll=this.checked"> 自动滚动
      </label>
      <span style="font-size:0.7rem;color:var(--text-muted)" id="logCount">0 行</span>
    </div>
  </div>
  <div class="terminal" id="logTerminal">连接中...</div>`;

  window._autoScroll=true;
  connectLogs(agentId);
}

function connectLogs(agentId){
  if(detailWs){detailWs.close();detailWs=null}
  detailLogs=[];
  const term=document.getElementById('logTerminal');
  const wsStatus=document.getElementById('wsStatus');
  const logCount=document.getElementById('logCount');

  const ws=new WebSocket('ws://localhost:8000/ws/agents/'+agentId+'/logs');
  detailWs=ws;

  ws.onopen=()=>{
    wsStatus.innerHTML='● 已连接';wsStatus.style.color='var(--green)';
  };
  ws.onmessage=(e)=>{
    detailLogs.push(e.data);
    if(detailLogs.length>1000)detailLogs=detailLogs.slice(-1000);
    term.innerHTML=detailLogs.map(l=>`<div class="line">${escapeHtml(l)}</div>`).join('');
    logCount.textContent=detailLogs.length+' 行';
    if(window._autoScroll)term.scrollTop=term.scrollHeight;
  };
  ws.onclose=()=>{wsStatus.innerHTML='● 已断开';wsStatus.style.color='var(--red)';};
  ws.onerror=()=>{wsStatus.innerHTML='● 连接错误';wsStatus.style.color='var(--red)';};
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
fetchAgents();
pollTimer=setInterval(fetchAgents,5000);

// Cleanup on page unload
window.addEventListener('beforeunload',()=>{
  clearInterval(pollTimer);
  if(detailWs)detailWs.close();
});
</script>
</body>
</html>
